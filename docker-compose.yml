services:
  jeu:
    build: .
    restart: unless-stopped
    ports:
      # client et WebSocket sur le même port ; lié à cette machine seulement, les amis passent par le tunnel
      - "127.0.0.1:${PORT_LOCAL:-8080}:8080"
    environment:
      TUNNEL_METRICS_URL: http://tunnel:2000 # pour lire l'adresse du tunnel rapide
      URL_PUBLIQUE: ${URL_PUBLIQUE:-}
    mem_limit: 512m
    # le contrôle de santé est défini dans le Dockerfile (GET /healthz)

  tunnel:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    # Par défaut : tunnel rapide sans compte. Tunnel nommé : TUNNEL_ARGS=run et TUNNEL_TOKEN dans .env.
    command: tunnel --no-autoupdate --metrics 0.0.0.0:2000 ${TUNNEL_ARGS:---url http://jeu:8080}
    env_file:
      - path: .env
        required: false
    depends_on:
      jeu:
        condition: service_healthy
